<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img"
     aria-label="Monogramme R et D sur un socle d'immeuble">
  <!-- Candidat D — « Le monogramme ». Sobre, sans métaphore, impossible à
       confondre avec une autre app de finances. Tient à toutes les tailles. -->
  <rect width="512" height="512" rx="112" fill="#1F3864"/>
  <text x="256" y="300" font-family="Georgia,'Times New Roman',serif" font-size="196" font-weight="700"
        fill="#F2F4F8" text-anchor="middle" letter-spacing="-6">RD</text>
  <!-- Socle : trois immeubles de hauteurs croissantes -->
  <g fill="#2E9E5B">
    <rect x="150" y="372" width="56" height="44" rx="6"/>
    <rect x="228" y="350" width="56" height="66" rx="6"/>
    <rect x="306" y="328" width="56" height="88" rx="6"/>
  </g>
</svg>
